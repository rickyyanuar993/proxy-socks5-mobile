name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build SOCKS5 FRP APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: core/go.sum

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK & Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          # GitHub runner ubuntu-latest sudah memiliki NDK terpasang di $ANDROID_SDK_ROOT/ndk
          # Ambil versi NDK terbaru yang sudah tersedia
          NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* | sort -V | tail -n 1)
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "Using Android NDK at: $NDK_PATH"

      - name: Build Go Mobile AAR Library
        working-directory: core
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
          gomobile bind -v -target=android/arm64,android/arm,android/amd64 -o ../app/libs/proxycore.aar .

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        run: |
          chmod +x gradlew || gradle wrapper
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-Socks5-FRP-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
